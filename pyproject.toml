[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cndriveai"
version = "0.1.0"
description = "Offline evidence-grounded engineering assistant foundations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Selim Kandaz" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.21"]
training = ["torch>=2.6", "transformers>=5.0", "peft>=0.15", "optimum-quanto>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Human-readable synthetic prompts and answers are intentionally long prose.
"src/cndriveai/dataset.py" = ["E501"]
